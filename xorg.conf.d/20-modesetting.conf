# X-конфіг РЕДАКТОРА РОЗКЛАДКИ. Їде разом зі станцією, а не з образом.
#
# Це повна копія вендорського /etc/X11/xorg.conf.d/20-modesetting.conf з
# рівно однією зміною: AccelMethod "glamor" -> "none". Копія повна, бо
# наглядач піднімає X з -configdir на цей каталог, а -configdir ЗАМІНЮЄ
# /etc/X11/xorg.conf.d цілком, а не доповнює його. Усе, чого тут немає,
# для редактора не існує.
#
# ЧОМУ "none". На платі стоїть пропрієтарний libmali, і glamor міняє
# місцями червоний із синім на копії текстури в буфер сканування: кнопка
# "+ додати" ставала червоною, "Вихід" синім, небо жовтим. Своп сидить
# НИЖЧЕ за X-пам'ять — у пам'яті кадр правильний, тому будь-який знімок
# екрана (GetImage, xwd) виглядає нормально, і баг видно виключно очима.
# З тієї ж причини не допомагає SDL_RENDERER_SOFTWARE у редакторі: своп
# на два шари нижче за SDL. У коді редактора міняти нічого не треба.
#
# Прискорення тут нічого не втрачає: X на станції існує лише заради
# osd_editor, а той малює програмно — клієнтський GLX/DRI3 на libmali не
# піднімається взагалі ("libGL error: failed to load driver: rockchip").
# Сама станція vrx_gl іде повз X, через DRM/KMS, і цього файла не бачить.
#
# Якщо на конкретній станції у вендорському файлі є свої правки (поворот
# екрана тощо) — переносити їх треба СЮДИ, інакше редактор їх не побачить.

Section "Device"
    Identifier  "Rockchip Graphics"
    Driver      "modesetting"

### Use Rockchip RGA 2D HW accel
#    Option      "AccelMethod"    "exa"

### GPU HW accel вимкнено навмисно: glamor поверх libmali свопить R<->B.
    Option      "AccelMethod"    "none"

    Option      "DRI"            "2"

### Set to "always" to avoid tearing, could lead to up 50% performance loss
    Option      "FlipFB"         "always"

### Limit flip rate and drop frames for "FlipFB" to reduce performance lost
#    Option      "MaxFlipRate"    "60"

    Option      "NoEDID"         "true"
    Option	"UseGammaLUT"	 "true"
EndSection

Section	"Screen"
    Identifier	"Default Screen"
    Device	"Rockchip Graphics"
    Monitor	"Default Monitor"
EndSection

### Valid values for rotation are "normal", "left", "right"
Section	"Monitor"
    Identifier	"Default Monitor"
    Option	"Rotate" "normal"
EndSection
